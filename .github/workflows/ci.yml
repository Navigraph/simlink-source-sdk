name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup installs the toolchain from rust-toolchain.toml on first use.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The generators take minutes to compile; xtask pins them in generators.rs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tools
          key: uniffi-generators-${{ runner.os }}-${{ hashFiles('xtask/src/generators.rs') }}

      # Pinned so a runner image update can't silently change the compiler. Rust links with the same Visual Studio.
      - name: Pin the MSVC toolset
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CMAKE_GENERATOR=Visual Studio 18 2026" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR_TOOLSET=v145" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - run: cargo test --workspace --locked
      # Builds every example against the bindings, then checks each one joins a test Simlink and answers it.
      - run: cargo xtask examples
      - run: cargo xtask docs --check
        if: runner.os == 'Linux'

  # rust-toolchain.toml pins what we develop with; this checks the oldest Rust that `rust-version` promises.
  msrv:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the workspace's rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo +"$MSRV" check --workspace --all-targets --locked
