name: Docker

# Checks the development image still builds and passes when anything it installs changes.
on:
  push:
    branches: [main]
    paths: &paths
      - Dockerfile
      - compose.yaml
      - .dockerignore
      - rust-toolchain.toml
      - global.json
      - .github/workflows/docker.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: docker compose build
      - run: docker compose run --rm dev cargo test --workspace --locked
      - run: docker compose run --rm dev cargo xtask examples
