name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  platform:
    strategy:
      matrix:
        os: [windows-2025, ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(cargo pkgid -p simlink-source-sdk | sed 's/.*[#@]//')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tools
          key: uniffi-generators-${{ runner.os }}-${{ hashFiles('xtask/src/generators.rs') }}

      - name: Pin the MSVC toolset
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CMAKE_GENERATOR=Visual Studio 18 2026" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR_TOOLSET=v145" >> "$GITHUB_ENV"

      # Cross-link Linux builds against an older glibc.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: runner.os == 'Linux'
        with:
          version: 0.17.1
      - run: cargo install --locked cargo-zigbuild --version 0.24.1
        if: runner.os == 'Linux'

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - run: cargo test --workspace --locked
      - run: cargo xtask examples
      - run: cargo xtask package cpp
      - run: cargo xtask package csharp-runtime

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpp-${{ runner.os }}
          path: target/package/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csharp-runtime-${{ runner.os }}
          path: target/package/runtimes
          if-no-files-found: error

  release:
    needs: platform
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tools
          key: uniffi-generators-${{ runner.os }}-${{ hashFiles('xtask/src/generators.rs') }}

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cpp-*
          path: target/package
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: csharp-runtime-*
          path: target/package/runtimes
          merge-multiple: true

      - run: cargo xtask package csharp

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: target/package/*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget
          path: target/package/simlink-source-sdk-csharp-*/*.nupkg
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget
          path: nuget

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        with:
          user: Navigraph

      - run: >-
          dotnet nuget push "nuget/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-io

      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}

  # Skip prereleases so vcpkg baseline updates stay on stable versions.
  vcpkg:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-26.04

    steps:
      - run: >-
          gh api repos/Navigraph/vcpkg-registry/dispatches
          -f event_type=simlink-source-sdk-released
          -f "client_payload[version]=${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
