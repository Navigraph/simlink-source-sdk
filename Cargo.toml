[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "1.0.0-rc1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Navigraph/simlink-source-sdk"
rust-version = "1.88"

[workspace.dependencies]
simlink-source-sdk-macros = { path = "crates/simlink-source-sdk-macros" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.61", default-features = false }
log = "0.4"
mdns-sd = "0.21"
proc-macro2 = "1"
quote = "1"
schemars = { version = "0.8", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full"] }
typify = "0.8"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
uniffi = "0.31"

[profile.release]
lto = true
codegen-units = 1
