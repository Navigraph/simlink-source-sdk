[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "1.0.0-rc.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/Navigraph/simlink-source-sdk"
rust-version = "1.95"

[workspace.dependencies]
# Exact, since the macro generates code against this release of the SDK.
simlink-source-sdk-macros = { path = "crates/simlink-source-sdk-macros", version = "=1.0.0-rc.3" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
heck = "0.5"
jsonschema = { version = "0.61", default-features = false }
log = "0.4"
polling = "3"
mdns-sd = "0.21"
proc-macro2 = "1"
quote = "1"
schemars = { version = "0.8", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_path_to_error = "0.1"
serde_json = "1"
syn = { version = "3", features = ["full"] }
typify = "0.8"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
uniffi = "0.31"

[profile.release]
lto = true
codegen-units = 1
